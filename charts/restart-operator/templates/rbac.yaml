{{- if .Values.rbac.create -}}
{{- $scoped := ne (default "" .Values.operator.watchNamespace) "" -}}
{{- $kind := ternary "Role" "ClusterRole" $scoped -}}
{{- $bindingKind := ternary "RoleBinding" "ClusterRoleBinding" $scoped -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ include "restart-operator.fullname" . }}
  {{- if $scoped }}
  namespace: {{ .Values.operator.watchNamespace }}
  {{- end }}
  labels:
    {{- include "restart-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["restart-operator.k8s"]
    resources: ["restartschedules"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["restart-operator.k8s"]
    resources: ["restartschedules/status"]
    verbs: ["get", "update", "patch"]
  # Restarts are triggered by patching the pod template of the workload
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $bindingKind }}
metadata:
  name: {{ include "restart-operator.fullname" . }}
  {{- if $scoped }}
  namespace: {{ .Values.operator.watchNamespace }}
  {{- end }}
  labels:
    {{- include "restart-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ include "restart-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "restart-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

{{- if .Values.operator.leaderElection.enabled }}
---
# Leader election only needs leases in the operator's own namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "restart-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restart-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "restart-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "restart-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "restart-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "restart-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
